[mod-setting-description]
hps__ml-debug-mode=Enable debug functionality. Only turn on if you debug this mod.
hps__ml-loader_snapping=Snap loaders when belts are built next to them.
hps__ml-default_mode=The operating mode used for newly placed Miniloaders. Loaders built from blueprints or restored configurations keep their saved mode.
hps__ml-chute_loader=A simple, slow loader that is available with logistics.
hps__ml-no_power=Miniloaders don't use any electrical power. Because they are magical and not OP enough as-is.
hps__ml-migrate_loaders=Migrate Factorio 1.1 Miniloaders (https://mods.factorio.com/mod/miniloader) to this mod. Only supports Base game miniloaders.
hps__ml-sanitize_loaders=Some other mods add loaders that declare collision masks that are not compatible with Miniloader Redux. This results in errors mentioning <Entity A> must collide with <Miniloader Entity> collision mask. Enabling this setting tries to patch these loaders to be compatible. There is no guarantee that this works and it may even break other mods further.
hps__ml-double_recipes=Multiply all recipes by two and return two miniloaders. This is for everyone that is annoyed by miniloader recipes using an odd number of underground belts.
hps__ml-check_speed_mode=On startup, inspect all Miniloaders if they interact with a chest or assembly machine. If yes, turn on Speed mode for that Miniloader.
hps__ml-spill_items=A Miniloader consists of multiple entities and it is possible when switching filters or the operations mode that items get stuck inside the loader which will block its operation. The Miniloader can either remove these items and spill them on the ground, marking them for pickup by robots or silently discard and destroy these items. This is the default setting for new miniloaders which can be changed in the GUI.
hps__ml-fix_blueprint_mods=Support some Blueprint Mods (e.g. Blueprint Sandboxes or Blueprint Shotgun) that hit a bug in the Factorio game and leave Miniloaders incomplete. This is a workaround, not guaranteed to work and might cause problems with other mods. Activate at your own risk.

